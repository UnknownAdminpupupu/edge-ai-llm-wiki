<style>
:root{--bg:#eef1ef;--panel:#e2e8e4;--ink:#16201c;--muted:#56645e;--line:#c6d0cb;--copper:#a8541f}
@media (prefers-color-scheme:dark){:root{--bg:#111614;--panel:#19211d;--ink:#e4ebe7;--muted:#9baba4;--line:#2b3631;--copper:#e39a66;color-scheme:dark}}

.links a{display:flex;flex-direction:column;gap:4px;padding:20px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink);text-decoration:none}
.links a:hover{border-color:var(--copper)}
.links b{font-size:20px;color:var(--copper)}
.links span{color:var(--muted);font-size:15px}
p.note{color:var(--muted);font-size:14px;margin-top:32px}
p.note a{color:var(--copper)}
